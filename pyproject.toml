[project]
name = "mini-agent"
version = "0.1.0"
description = "从零构建 AI Agent —— 学习 LangChain + LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.3.2",
    "langchain-openai>=1.2.1",
    "langgraph>=1.1.10",
    "python-dotenv>=1.2.2",
]

[project.scripts]
mini-agent = "mini_agent.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
